# General ---------------------------------------------------------------------

# Keep the default C-b prefix so the config remains familiar and portable.
set -g prefix C-b
unbind C-b
bind C-b send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm*:clipboard"
set -g set-clipboard on

set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g allow-rename off

# Windows and panes -----------------------------------------------------------

# Create new windows and panes in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind '%'
bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# Reload with prefix + r.
bind r source-file "#{config_files}" \; display-message "tmux config reloaded"

# Resize panes with prefix + Shift-h/j/k/l.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Seamless Neovim/tmux navigation --------------------------------------------

# These bindings pair with christoomey/vim-tmux-navigator in Neovim.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Copy mode and system clipboard ---------------------------------------------

setw -g mode-keys vi

# WSL uses clip.exe; Linux/Wayland, Linux/X11, and macOS use their native tools.
# Falling back to `tmux load-buffer -` still preserves the selection in tmux.
clipboard_command='if command -v clip.exe >/dev/null 2>&1; then clip.exe; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else tmux load-buffer -; fi'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$clipboard_command"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$clipboard_command"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$clipboard_command"

# Status line -----------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]#(whoami)@#H #[fg=#89b4fa]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W #[default]"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#f9e2af,fg=#1e1e2e"
